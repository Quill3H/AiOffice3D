<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Văn Phòng AI Studio - ChatGPT Bridge</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 12px;
    }
    .logo-badge {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 14px;
      color: #000;
    }
    .title {
      font-weight: 700;
      font-size: 13px;
      color: #f1f5f9;
    }
    .subtitle {
      font-size: 11px;
      color: #94a3b8;
    }
    .status-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      margin-bottom: 6px;
    }
    .status-row:last-child {
      margin-bottom: 0;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 6px;
    }
    .dot-online { background: #10b981; box-shadow: 0 0 6px #10b981; }
    .dot-offline { background: #ef4444; }
    .btn {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      text-align: center;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #050811;
      font-weight: 700;
      font-size: 12px;
      border-radius: 10px;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }
    .info-tip {
      font-size: 11px;
      color: #64748b;
      margin-top: 10px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo-badge">VP</div>
    <div>
      <div class="title">Văn Phòng AI Studio</div>
      <div class="subtitle">ChatGPT Plus Web Bridge v1.0</div>
    </div>
  </div>

  <div class="status-card">
    <div class="status-row">
      <span style="color:#94a3b8;">Dashboard Local:</span>
      <span id="dash-status"><span class="status-dot dot-offline"></span>Đang kiểm tra...</span>
    </div>
    <div class="status-row">
      <span style="color:#94a3b8;">ChatGPT Tab:</span>
      <span id="tab-status">Kiểm tra...</span>
    </div>
  </div>

  <button class="btn" id="open-dash-btn">Mở Dashboard Văn Phòng AI</button>

  <div class="info-tip">
    💡 <b>Hướng dẫn:</b> Mở sẵn tab ChatGPT (đoạn chat của Trưởng phòng) trên Chrome. Khi bạn phát lệnh trên Dashboard, tin nhắn sẽ tự động gửi vào phòng chat này.
  </div>

  <script src="popup.js"></script>
</body>
</html>
